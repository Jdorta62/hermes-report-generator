[project]
name = "hermes-report"
version = "0.1.0"
description = "Hermes Report Generator"
authors = [{ name = "Jose Gregorio Dorta Luis" }]
requires-python = ">=3.12"
dependencies = [
  "hermes-core==0.6.0",
  "hermes-enrich",
  "hermes-generator[ollama]",
  "hermes-ingest-md",
  "hermes-retrieval",
  "qdrant-client>=1.12",
]

[project.scripts]
hermes-report = "hermes_report.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.4",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "ruff>=0.16",
  "rust-just>=1.58",
]
notebook = [
  "ipykernel>=7.4.0",
  "jupyterlab>=4.6.4",
  "nbclient>=0.11.0",
  "pandas>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
indent-width = 2
target-version = "py312"
# Never touch Markdown (ruff formats code blocks in .md files).
extend-exclude = ["*.md"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
  "integration: needs the real Ollama and Qdrant and the prepared Quijote corpus; deselected by default, run with `uv run pytest -m integration`",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

# nltk (used by the chunker through llama-index-core) refuses hardlinked data
# files, which is what uv installs by default from its cache.
[tool.uv]
link-mode = "copy"
# The notebook test (nbclient) runs in `just check`, so its group is synced too.
default-groups = ["dev", "notebook"]

# Each module is pinned to a commit of its repository; bump them together.
[tool.uv.sources]
hermes-core = { git = "https://github.com/Jdorta62/hermes-core", tag = "v0.6.0" }
hermes-enrich = { git = "ssh://git@github.com/Jdorta62/hermes-enrich.git", rev = "1f6befe795026f944617960c531a71339f367f94" }
hermes-generator = { git = "ssh://git@github.com/Jdorta62/hermes-generator.git", rev = "bf59c88183f61608d056c18eb2d8c623140aceba" }
hermes-ingest-md = { git = "ssh://git@github.com/hermes-ingestion/hermes-ingestion-md.git", rev = "53a8e6404db9581381be1c55f743ae1df4359b50" }
hermes-retrieval = { git = "ssh://git@github.com/Jdorta62/hermes-retrieval.git", rev = "b1875bba6c462bd7690d7886f2474c2136e2100b" }
